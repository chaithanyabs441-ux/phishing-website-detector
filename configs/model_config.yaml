version: 1
feature_versions:
  url_tfidf: url_string_v1
  url_engineered: url_features_v1
  url_html: url_features_v1 + html_features_v1
artifacts:
  url_tfidf: url_tfidf.joblib
  url_linear_svm: url_linear_svm.joblib
  combined_tfidf: combined_tfidf.joblib
  combined_linear_svm: combined_linear_svm.joblib
  combined_url_scaler: combined_url_scaler.joblib
  url_html_tfidf: url_html_tfidf.joblib
  url_html_linear_svm: url_html_linear_svm.joblib
  url_html_scaler: url_engineered_scaler.joblib
  html_scaler: html_scaler.joblib
  html_feature_columns: html_feature_columns.joblib
thresholds:
  url_tfidf: 1.5
  url_engineered: 0.0
  url_html: 0.0
default_model: catboostengineered
fallback_model: url_tfidf
serving:
  selected_model: catboostengineered
  primary_model: models/phase4/catboostengineered.joblib
  calibrator: models/phase7/catboost_engineered_calibrator.joblib
  fallback_model: url_tfidf
  fallback_vectorizer: models/url_tfidf.joblib
  fallback_classifier: models/url_linear_svm.joblib
  thresholds: configs/thresholds.yaml
  top_sites_file: configs/top_sites.txt
  shared_hosting_file: configs/shared_hosting_domains.txt
  enable_html_fetch: false
  max_url_chars: 4096
  max_html_chars: 10000000
  max_html_upload_bytes: 10000000
  max_request_bytes: 12000000
  rate_limit_per_minute: 30
  fetcher:
    max_bytes: 1000000
    timeout_seconds: 4
    max_redirects: 3
