version: 1
seed: 42
selected_model: catboostengineered
model_artifact: models/phase4/catboostengineered.joblib
split: data/splits/temporal_assignments.csv.gz
calibration:
  methods:
    - platt
    - isotonic
  grouped_folds: 5
  ece_bins: 10
thresholds:
  assumed_prevalence: 0.05
  block_max_fpr: 0.001
  warn_min_recall: 0.95
bootstrap:
  replicates: 200
  confidence_level: 0.95
benchmark:
  root: data/benchmarks/benchmark
  p_at_recall: 0.90
  expected_hash_pattern: sha256
test_access:
  shards: data/raw/data/test-*.parquet
  command: .\.venv\Scripts\python.exe -m src.evaluation.evaluate_phase7_final --config configs/phase7_calibration.yaml