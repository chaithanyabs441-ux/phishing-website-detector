version: 1
seed: 42
split: data/splits/temporal_assignments.csv.gz
grouped_folds: 5
n_jobs: 4
base_models:
  - lightgbm
  - xgboost
  - catboost
  - char_svc_2_5_min_df3
meta:
  logistic:
    C: 1.0
    class_weight: balanced
  lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 3
    num_leaves: 7
    min_child_samples: 40
bootstrap:
  replicates: 200
  confidence_level: 0.95